name: PHPStan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  phpstan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Run PHPStan (Level 1)
      run: vendor/bin/phpstan analyse --level=1 --memory-limit=2G --error-format=github .
      
    - name: Run PHPStan (Max Level - Optional)
      run: vendor/bin/phpstan analyse --level=5 --memory-limit=2G --error-format=github .
      continue-on-error: true  # Don't fail the build on higher level